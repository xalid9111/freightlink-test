# Supabase Edge Functions — deploy one function by hand (owner, 21.10.2026).
# Started only from GitHub → Actions → "Supabase functions" → Run workflow
# (works from a phone). It never runs on push and never touches GitHub
# Pages, the database or user data: it uploads the chosen function's code
# from supabase/functions/ to the Supabase project.
#
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase → Account →
# Access Tokens). The token is never printed or stored in the repository.
name: Supabase functions

on:
  workflow_dispatch:
    inputs:
      function:
        description: Function to deploy
        type: choice
        options:
          - payments-checkout
          - payments-webhook
        default: payments-checkout

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check the access token is set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN first (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ${{ inputs.function }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # verify_jwt per function comes from supabase/config.toml.
        run: supabase functions deploy "${{ inputs.function }}" --project-ref jqdqtfmxnqezlsetelpi
