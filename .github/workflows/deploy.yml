name: Deploy FreightLink Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.4
          cache: true

      - name: Build web
        run: |
          printf 'APP_ENV=production\n' > .env
          flutter pub get
          flutter build web --release \
            --base-href "/" \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=APP_ENV=production \
            --dart-define=BUILD_ID=${{ github.sha }}
          touch build/web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If GitHub Pages times out while syncing (10.11.2026, its own trouble),
      # the deployment stays tied to that commit: "Re-run" of the same run
      # waits on an empty status and fails again. Deploy with a new commit on
      # main (a pull request) instead.
      - id: deployment
        uses: actions/deploy-pages@v4
