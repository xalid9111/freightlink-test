# Supabase "Reset password" e-mail — written by hand (owner, 21.11.2026:
# "kopyala-yapışdır telefonda alınmır, kompüterim yoxdur, sən et").
# Started only from GitHub → Actions → "Supabase auth email" → Run workflow
# (works from a phone). It never runs on push and never touches the web
# site, the database or user data: it sets ONLY the recovery e-mail's
# subject and body in the project's Auth settings (Management API) from
# supabase/auth/recovery_subject.txt + recovery_email.html — the token_hash
# link of docs/RESET_PASSWORD_EMAIL.md — and checks it was saved.
#
# Uses the existing repository secret SUPABASE_ACCESS_TOKEN (also used by
# "Supabase functions" / "OSM truck parks"); it is never printed.
name: Supabase auth email

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-auth-email
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REF: jqdqtfmxnqezlsetelpi
    steps:
      - uses: actions/checkout@v4

      - name: Check the access token is set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN first (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Write the recovery e-mail (subject + body only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          grep -q 'token_hash={{ .TokenHash }}&type=recovery' supabase/auth/recovery_email.html
          jq -n --rawfile s supabase/auth/recovery_subject.txt --rawfile b supabase/auth/recovery_email.html \
            '{mailer_subjects_recovery: ($s | rtrimstr("\n")), mailer_templates_recovery_content: $b}' > body.json
          code=$(curl -sS -o out.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data @body.json)
          echo "PATCH answer: $code"
          if [ "$code" != "200" ]; then
            jq -r '.message // .error // "no message"' out.json || true
            exit 1
          fi

      - name: Check it was saved
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -f "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > now.json
          subject=$(jq -r '.mailer_subjects_recovery' now.json)
          echo "Subject now: $subject"
          if jq -e '.mailer_templates_recovery_content | contains("token_hash={{ .TokenHash }}&type=recovery")' now.json > /dev/null; then
            echo "✓ The reset e-mail now links to https://tirlink.app/#/reset-password?token_hash=…"
          else
            echo "::error::The saved body does not hold the token_hash link."
            exit 1
          fi
