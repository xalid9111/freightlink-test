<!DOCTYPE html>
<html lang="az">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- viewport-fit=cover is required for Flutter's web engine to read
       CSS env(safe-area-inset-*) on notched iPhones when the PWA runs
       in standalone mode (Part of PWA requirement: safe-area support). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="TırLink — yük və daşıyıcı platforması · www.tirlink.app">

  <!-- Browser chrome / address-bar color, matches app theme -->
  <meta name="theme-color" content="#02050C">
  <meta name="background-color" content="#02050C">

  <!-- iOS "Add to Home Screen" support. iOS does not reliably read
       manifest.json for installability/icon/display-mode the way
       Android Chrome does, so these meta tags + the apple-touch-icon
       link below are required IN ADDITION TO the manifest, not instead
       of it. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- NOT "black-translucent" (owner, 24.10.2026, iPhone 11 Pro, app on
       the Home Screen): the page then lies under the status bar, but
       Flutter replaces the viewport tag without viewport-fit=cover, so
       taps landed about one status-bar height off — a button only
       opened when touched slightly above it. With a solid bar the page
       starts below it and taps hit exactly. Day mode: light bar (set
       below, before the first paint). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TırLink">
  <!-- TIR Link icons (owner, 14.11.2026): new file names so no browser or
       iPhone keeps the old orange icon from its cache. -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/tirlink-apple-touch-v4.png">

  <!-- Android / general PWA install support -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Favicon from the new T logo (owner, 22.11.2026; Google wants a square,
       a multiple of 48 px, on a stable address). -->
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48"/>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/tirlink-favicon-t-32.png"/>
  <link rel="icon" type="image/png" sizes="48x48" href="icons/tirlink-favicon-t-48.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/tirlink-favicon-t-192.png"/>
  <!-- Who runs the site and its logo, for Google (no social links: none given). -->
  <link rel="canonical" href="https://tirlink.app/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TırLink">
  <meta property="og:title" content="TırLink — Yük Marketpleysi">
  <meta property="og:description" content="TırLink — yük və daşıyıcı platforması · www.tirlink.app">
  <meta property="og:url" content="https://tirlink.app/">
  <meta property="og:image" content="https://tirlink.app/icons/tirlink-logo-org-512.png">
  <meta property="og:locale" content="az_AZ">
  <meta name="twitter:card" content="summary">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Organization","name":"TırLink","alternateName":"TirLink","url":"https://tirlink.app/","logo":"https://tirlink.app/icons/tirlink-logo-org-512.png"}
  </script>
  <!-- Start downloading the app itself at once, in parallel with the
       start-up scripts (owner, 24.10.2026: "sayt gec yüklənir"). -->
  <link rel="preload" href="main.dart.js" as="script">
  <!-- Faster start (owner, 09.11.2026, "dərhal açılsın"): everything the
       app waits for before its first screen starts downloading now, side
       by side with main.dart.js, instead of one after another later:
       the connections to Google's servers (drawing engine, fallback font)
       and the fonts (measured, 09.11.2026). The flags font is NOT
       preloaded: on a slow network it held up the app itself. The Roboto
       address belongs to this Flutter version
       (test/startup_speed_test.dart keeps it in step). -->
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="assets/assets/fonts/FreightLinkSans-Regular.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/FreightLinkSans-Bold.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/FreightLinkSans-Italic.ttf" as="fetch" crossorigin>
  <link rel="preload" href="https://fonts.gstatic.com/s/roboto/v32/KFOmCnqEu92Fr1Me4GZLCzYlKw.woff2" as="fetch" crossorigin>

  <title>TırLink — Yük Marketpleysi</title>

  <style>
    /* Splash shown while the Flutter engine downloads/boots, so the
       user sees the brand instead of a blank white page — this is
       real loading UI, not a fake feature demo. Flutter replaces the
       whole document body once it takes over, so this doesn't leak
       into the running app. */
    html, body {
      height: 100%;
      margin: 0;
      background: #02050C;
    }
    #app-loading {
      position: fixed;
      inset: 0;
      /* Stays above the app until its first frame is drawn. */
      z-index: 2147483000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: Arial, 'Liberation Sans', Helvetica, sans-serif;
      color: #fff;
      background: #02050C;
    }
    #app-loading img {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }
    #app-loading .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #FF5A1F;
      border-radius: 50%;
      animation: fl-spin 0.9s linear infinite;
    }
    @keyframes fl-spin { to { transform: rotate(360deg); } }
    /* Day mode (Settings → Görünüş): light splash, no dark flash. */
    html.day, html.day body, html.day #app-loading { background: #FFFFFF; color: #0F1B2D; }
    html.day #app-loading .spinner { border-color: rgba(15,27,45,0.15); border-top-color: #FF5A1F; }
    /* Neumorf (0137, owner 24.11.2026): the page ground under / around the
       app is the Neumorf colour too, so nothing black shows at the top or
       when the page is pulled (graphite at night, light grey by day). */
    html.neu, html.neu body, html.neu #app-loading { background: #20262F; }
    html.neu.day, html.neu.day body, html.neu.day #app-loading { background: #E8EBF0; }
  </style>
  <script>
    // The app keeps the choice in localStorage (SharedPreferences key
    // app_theme_mode); read it before the first paint.
    try {
      if (localStorage.getItem('flutter.app_theme_mode') === '"day"') {
        document.documentElement.classList.add('day');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FFFFFF');
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'default');
      }
    } catch (e) {}
    // Neumorf (0137): this device's try-out first, else the kept answer.
    try {
      var neuPrev = localStorage.getItem('flutter.ui_neumorph_preview');
      var neu = (neuPrev !== null ? neuPrev : localStorage.getItem('flutter.ui_neumorph')) === 'true';
      if (neu) {
        var dayNeu = document.documentElement.classList.contains('day');
        document.documentElement.classList.add('neu');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dayNeu ? '#E8EBF0' : '#20262F');
        // Test (admin's switch, this device only, owner 24.11.2026): the
        // status bar see-through at night so the graphite runs under the
        // clock like other apps. The page then starts under the bar, so the
        // viewport keeps viewport-fit=cover (Flutter's own tag drops it —
        // the 24.10.2026 tap shift) and the app gets the bar's height as
        // room on top (window.flStatusBar).
        if (!dayNeu && localStorage.getItem('flutter.perf_translucent_bar') === 'true') {
          document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'black-translucent');
          var keepCover = function () {
            var m = document.querySelector('meta[name="viewport"]');
            if (m && (m.getAttribute('content') || '').indexOf('viewport-fit=cover') < 0) {
              m.setAttribute('content', (m.getAttribute('content') || '') + ', viewport-fit=cover');
            }
          };
          new MutationObserver(keepCover).observe(document.head, { childList: true, subtree: true, attributes: true });
          var probe = null;
          window.flStatusBarRoom = function () {
            try {
              keepCover();
              if (!probe) {
                probe = document.createElement('div');
                probe.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top);pointer-events:none;visibility:hidden';
                document.documentElement.appendChild(probe);
              }
              return probe.getBoundingClientRect().height || 0;
            } catch (e) { return 0; }
          };
        }
      }
    } catch (e) {}
  </script>
</head>

    <picture><source srcset="icons/tirlink-logo-v2-144.webp" type="image/webp"><img src="icons/tirlink-logo-v2-144.png" alt="TırLink" width="72" height="72"></picture>

  <!-- The Baş admin's logos (Admin → Loqolar, SQL 0124), the device's last copy. -->
  <script id="site-logos">
// The site's logos chosen by the Baş admin (owner, 15.11.2026, SQL 0124).
// Runs right after the start-up logo is on the page, before the app loads:
// the device's last copy (localStorage "fl_site_logos", written by the app)
// replaces the start-up logo and the Home Screen / tab icon links, so a new
// "Ana ekrana əlavə et" takes the new icon. Nothing set = the built-in files
// stay exactly as they are. Never throws; touches nothing else.
(function () {
  var KEY = 'fl_site_logos';
  function read() {
    try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; }
  }
  function links(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
  // The built-in links, to go back to them when a logo is reset.
  var builtIn = [];
  links('link[rel="apple-touch-icon"], link[rel="icon"], link[rel="manifest"]').forEach(function (l) {
    builtIn.push([l, l.getAttribute('href')]);
  });
  var manifestUrl = null;

  function applyIcon(url) {
    if (!url) {
      builtIn.forEach(function (p) { p[0].setAttribute('href', p[1]); });
      return;
    }
    links('link[rel="apple-touch-icon"], link[rel="icon"]').forEach(function (l) { l.setAttribute('href', url); });
    // Android reads the icon from the manifest: the same manifest with the new icon.
    try {
      fetch('manifest.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (m) {
        m.icons = [
          { src: url, sizes: '512x512', type: 'image/png', purpose: 'any' },
          { src: url, sizes: '192x192', type: 'image/png', purpose: 'any' }
        ];
        m.start_url = location.origin + '/';
        m.scope = location.origin + '/';
        var blob = new Blob([JSON.stringify(m)], { type: 'application/manifest+json' });
        if (manifestUrl) URL.revokeObjectURL(manifestUrl);
        manifestUrl = URL.createObjectURL(blob);
        links('link[rel="manifest"]').forEach(function (l) { l.setAttribute('href', manifestUrl); });
      }).catch(function () {});
    } catch (e) {}
  }

  function applySplash(url) {
    if (!url) return;
    var box = document.getElementById('app-loading');
    if (!box) return;
    links('#app-loading picture source').forEach(function (s) { s.remove(); });
    var img = box.querySelector('img');
    if (img) img.setAttribute('src', url);
  }

  var saved = read();
  applySplash(saved.splash);
  applyIcon(saved.app_icon);

  window.flLogos = {
    // From the app: keep the logos on the device and update the icon links now
    // (the start-up logo changes on the next start).
    apply: function (json) {
      try {
        var o = JSON.parse(json) || {};
        localStorage.setItem(KEY, JSON.stringify(o));
        applyIcon(o.app_icon);
      } catch (e) {}
    }
  };
})();
  </script>

  <script>
    // Visible boot diagnostics: if anything fails during engine/app
    // startup, show the actual error ON the splash instead of freezing
    // on a blank dark screen with no information. Defined here (sync,
    // before flutter_bootstrap.js) so the bootstrap script can call it.
    // The app calls this after its first frame (lib/core/startup/splash.dart):
    // the logo stays until the Yüklər page is really on screen — no empty
    // dark page in between (owner, 08.11.2026).
    window.flHideSplash = function () {
      var el = document.getElementById('app-loading');
      if (el) el.remove();
    };
    function flShowBootError(msg) {
      var el = document.getElementById('app-loading');
      if (!el) {
        el = document.createElement('div');
        el.id = 'app-loading';
        document.body.appendChild(el);
      }
      var box = document.createElement('pre');
      box.style.cssText = 'color:#FF8A5C;font-size:12px;max-width:90%;' +
        'white-space:pre-wrap;text-align:center;margin-top:16px;';
      box.textContent = 'TırLink start xətası / startup error:\n' + msg;
      el.appendChild(box);
    }
    // Only for errors DURING startup. Once the app is running
    // (window.flStarted, set in flutter_bootstrap.js) later errors must
    // never cover the app — e.g. iOS Safari fires a detail-less
    // cross-origin "Script error." when the share sheet opens.
    window.addEventListener('error', function (e) {
      if (window.flStarted) return;
      if (!e || !e.message || e.message === 'Script error.') return;
      flShowBootError(e.message);
    });
    window.addEventListener('unhandledrejection', function (e) {
      if (window.flStarted) return;
      flShowBootError(String(e.reason));
    });
  </script>

  <!-- Flutter 3.22+ bootstrap. The build turns web/flutter_bootstrap.js
       (a template) into build/web/flutter_bootstrap.js, injecting
       flutter.js AND _flutter.buildConfig. Calling _flutter.loader.load()
       directly from index.html with only flutter.js (the previous
       version of this file) fails at runtime with "FlutterLoader.load
       requires _flutter.buildConfig to be set". -->
  <script>
    // iPhone Safari: after the microphone has been used, audio keeps
    // playing through the quiet ear speaker. Switch the page's audio
    // session to "playback" (loud speaker) whenever something plays, and
    // back to "play-and-record" just before the microphone is opened.
    (function () {
      var session = navigator.audioSession;
      if (!session) return;
      // Patch play() itself: the chat's <audio> elements are not attached
      // to the page, so a document-level 'play' listener would miss them.
      var proto = window.HTMLMediaElement && HTMLMediaElement.prototype;
      if (proto && proto.play) {
        var origPlay = proto.play;
        proto.play = function () {
          try { session.type = 'playback'; } catch (e) {}
          return origPlay.apply(this, arguments);
        };
      }
      var md = navigator.mediaDevices;
      if (md && md.getUserMedia) {
        var orig = md.getUserMedia.bind(md);
        md.getUserMedia = function (c) {
          try { session.type = 'play-and-record'; } catch (e) {}
          return orig(c);
        };
      }
    })();
  </script>
  <script>
    // Cargo-feed "wheel" haptic (see lib/core/feedback). No sound.
    (function () {
      window.flWheelHaptic = function (kind) {
        try {
          if (navigator.vibrate) { navigator.vibrate(kind === 1 ? [10, 30, 10] : 8); return; }
        } catch (e) {}
        // iPhone Safari has no vibration API — nothing to do there.
      };
    })();
  </script>
  <!-- Display speed (owner, 16.11.2026: "FPS artırıcı — 1x 2x 3x, 30 / 40 /
       50–60 fps"). Ayarlar → Görünüş, kept on this device, read here BEFORE
       the app starts:
         * flutter.render_scale 1 / 2 / 3: the app draws at that pixel ratio
           when it is below the screen's own (fewer pixels a frame, same size);
           flutter.perf_render2 = the admin's older 2x test switch;
         * flutter.fps_cap 30 / 40: frames are drawn at most that often (an
           even, battery-saving pace; it never makes anything faster);
         * flutter.native_dpr / flutter.refresh_hz: what the screen really is,
           for the choices shown in Ayarlar. -->
  <script id="render-scale">
    (function () {
      try {
        var ls = window.localStorage;
        var native = window.devicePixelRatio || 1;
        ls.setItem('flutter.native_dpr', JSON.stringify(native));
        var scale = parseFloat(ls.getItem('flutter.render_scale') || '0');
        if (!(scale >= 1) && ls.getItem('flutter.perf_render2') === 'true') scale = 2;
        if (scale >= 1 && scale < native) {
          Object.defineProperty(window, 'devicePixelRatio', { get: function () { return scale; }, configurable: true });
        }
        // The screen's refresh rate (60 / 120 Hz), measured on a few frames.
        var raf = window.requestAnimationFrame.bind(window);
        var caf = window.cancelAnimationFrame.bind(window);
        var marks = [];
        raf(function tick(t) {
          marks.push(t);
          if (marks.length < 12) return raf(tick);
          var gaps = [];
          for (var i = 2; i < marks.length; i++) gaps.push(marks[i] - marks[i - 1]);
          gaps.sort(function (a, b) { return a - b; });
          var hz = Math.round(1000 / gaps[Math.floor(gaps.length / 2)]);
          try { ls.setItem('flutter.refresh_hz', JSON.stringify(hz)); } catch (e) {}
        });
        var cap = parseInt(ls.getItem('flutter.fps_cap') || '0', 10);
        if (cap === 30 || cap === 40) {
          var min = 1000 / cap - 4, last = 0, next = 1, live = {};
          window.requestAnimationFrame = function (cb) {
            var id = next++;
            var run = function (t) {
              if (!(id in live)) return;
              if (t - last >= min) { delete live[id]; last = t; cb(t); }
              else live[id] = raf(run);
            };
            live[id] = raf(run);
            return id;
          };
          window.cancelAnimationFrame = function (id) {
            if (id in live) { caf(live[id]); delete live[id]; } else { caf(id); }
          };
        }
      } catch (e) {}
    })();
  </script>
